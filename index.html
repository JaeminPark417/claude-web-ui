<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude · 수식 렌더링 챗</title>

<!-- Proven KaTeX + markdown stack (mirrors ~/.local/share/md-preview/viewer.html) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="preconnect" href="https://rsms.me">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/texmath.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>

<style>
:root{
  --bg:#1f1e1c; --bg2:#26241f; --panel:#2a2824; --panel2:#302d28;
  --bd:#3a372f; --bd2:#48443b;
  --tx:#ece9e1; --tx2:#b8b2a4; --tx3:#8a8576;
  --accent:#d97757; --accent2:#c45c3c;
  --user:#2f3a44; --userbd:#3c4b58;
  --green:#7bb37b; --red:#d77; --yellow:#d8b86a;
  --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,monospace;
  --sans:"Inter","Pretendard",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.62;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

/* top bar */
#bar{height:48px;flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
#bar .title{font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
#bar .title .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:inline-block}
#bar .spacer{flex:1}
#dot{width:9px;height:9px;border-radius:50%;background:var(--tx3);box-shadow:0 0 0 3px rgba(255,255,255,.04)}
#dot.on{background:var(--green)} #dot.off{background:var(--red)} #dot.busy{background:var(--yellow)}
select,button{font-family:var(--sans);font-size:13px;color:var(--tx);background:var(--panel);border:1px solid var(--bd2);border-radius:8px;padding:6px 10px;cursor:pointer}
select:hover,button:hover{background:var(--panel2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent2)}
#meta{font-size:12px;color:var(--tx3);font-family:var(--mono)}

/* messages */
#scroll{flex:1 1 auto;min-height:0;overflow-y:auto;scroll-behavior:smooth}
#log{max-width:820px;margin:0 auto;padding:26px 20px 40px}
.msg{margin:0 0 22px}
.msg .who{font-size:12px;color:var(--tx3);font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.msg.user .bubble{background:var(--user);border:1px solid var(--userbd);border-radius:12px;padding:11px 15px;white-space:pre-wrap}
.msg.assistant .bubble{padding:1px 2px}
.av{width:18px;height:18px;border-radius:5px;display:inline-block;vertical-align:-3px}
.av.a{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.av.u{background:#46586a}

/* rendered markdown */
.md{word-wrap:break-word}
.md p{margin:.5em 0}
.md h1,.md h2,.md h3,.md h4{margin:1.1em 0 .5em;line-height:1.3;font-weight:650}
.md h1{font-size:1.5em;border-bottom:1px solid var(--bd);padding-bottom:.2em}
.md h2{font-size:1.3em} .md h3{font-size:1.13em} .md h4{font-size:1em;color:var(--tx2)}
.md a{color:var(--accent);text-decoration:none} .md a:hover{text-decoration:underline}
.md code{font-family:var(--mono);font-size:.9em;background:#00000040;border:1px solid var(--bd);border-radius:5px;padding:1px 5px}
.md pre{background:#171614;border:1px solid var(--bd);border-radius:10px;padding:12px 14px;overflow:auto;margin:.7em 0}
.md pre code{background:none;border:none;padding:0;font-size:.86em;line-height:1.5}
.md blockquote{border-left:3px solid var(--bd2);margin:.6em 0;padding:.1em 1em;color:var(--tx2)}
.md ul,.md ol{padding-left:1.5em;margin:.4em 0}
.md li{margin:.18em 0}
.md table{border-collapse:collapse;margin:.7em 0;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--bd2);padding:6px 11px;text-align:left}
.md th{background:var(--panel)}
.md hr{border:none;border-top:1px solid var(--bd);margin:1.2em 0}
.md .katex{font-size:1.06em}
.md .katex-display{margin:.7em 0;overflow:auto hidden;padding:2px 0}
.md img{max-width:100%;border-radius:8px}

/* tool cards */
.tool{margin:8px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg2);overflow:hidden}
.tool>summary{cursor:pointer;list-style:none;padding:8px 12px;font-family:var(--mono);font-size:12.5px;color:var(--tx2);display:flex;align-items:center;gap:8px;user-select:none}
.tool>summary::-webkit-details-marker{display:none}
.tool>summary .tname{color:var(--accent);font-weight:600}
.tool>summary .targ{color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .body{border-top:1px solid var(--bd);padding:10px 12px;font-family:var(--mono);font-size:12px;color:var(--tx2);white-space:pre-wrap;max-height:340px;overflow:auto}
.tool .res{border-top:1px dashed var(--bd2);margin-top:8px;padding-top:8px;color:var(--tx)}
.tool .res.err{color:var(--red)}
.think{margin:6px 0;border:1px dashed var(--bd2);border-radius:10px;background:#00000022}
.think>summary{cursor:pointer;list-style:none;padding:7px 12px;font-size:12.5px;color:var(--tx3)}
.think>summary::-webkit-details-marker{display:none}
.think .body{padding:0 12px 10px;color:var(--tx3);font-style:italic;white-space:pre-wrap}

/* live typing + status */
.live{color:var(--tx);opacity:.95}
.cursor{display:inline-block;width:7px;height:1.05em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.working{display:inline-flex;align-items:center;gap:8px;color:var(--tx3);font-size:13px;padding:2px 0}
.spin{width:13px;height:13px;border:2px solid var(--bd2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.footer{font-size:11.5px;color:var(--tx3);font-family:var(--mono);margin-top:8px}
.err{color:var(--red);font-size:13px;white-space:pre-wrap}

/* composer */
#composer{flex:0 0 auto;background:var(--bg2);border-top:1px solid var(--bd);padding:12px 16px}
#cwrap{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--bd2);border-radius:14px;padding:8px 8px 8px 14px}
#cwrap:focus-within{border-color:var(--accent)}
#input{flex:1;background:none;border:none;color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.5;resize:none;max-height:240px;outline:none;padding:6px 0}
#send{flex:0 0 auto;width:38px;height:38px;padding:0;border-radius:10px;display:grid;place-items:center;font-size:17px}
#hint{max-width:820px;margin:6px auto 0;font-size:11px;color:var(--tx3);text-align:center}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:6px;border:2px solid transparent;background-clip:content-box}
</style>
</head>
<body>
<div id="bar">
  <span class="title"><span class="logo"></span> Claude Code · 수식 챗</span>
  <span id="dot" title="연결 상태"></span>
  <span class="spacer"></span>
  <span id="meta"></span>
  <select id="model" title="모델">
    <option value="opus">Opus</option>
    <option value="sonnet">Sonnet</option>
    <option value="haiku">Haiku</option>
  </select>
  <button id="newbtn" title="새 대화">＋ 새 대화</button>
</div>

<div id="scroll"><div id="log"></div></div>

<div id="composer">
  <div id="cwrap">
    <textarea id="input" rows="1" placeholder="메시지를 입력하세요…  (Enter 전송, Shift+Enter 줄바꿈)  ·  인라인 $a^2+b^2$ · 블록 $$…$$ 렌더됨" autofocus></textarea>
    <button id="send" class="primary" title="전송">➤</button>
  </div>
  <div id="hint">로컬 Claude Code 를 <code>~/vault</code> 에서 헤드리스로 구동 중 · 권한 bypass · 응답은 KaTeX 로 렌더링</div>
</div>

<script>
// ---------- markdown + KaTeX (inline $...$ AND display $$...$$) ----------
const md = window.markdownit({
  html:true, linkify:true, breaks:false, typographer:true,
  highlight:(str,lang)=>{ try{ if(lang && hljs.getLanguage(lang)) return hljs.highlight(str,{language:lang}).value; }catch(e){} return ''; }
});
if (window.texmath){
  md.use(window.texmath, { engine: window.katex, delimiters:'dollars', katexOptions:{ throwOnError:false, strict:false } });
}
const renderMd = (t)=> md.render(t || '');

// ---------- dom helpers ----------
const $ = (s)=>document.querySelector(s);
const logEl=$('#log'), scrollEl=$('#scroll'), dot=$('#dot'), metaEl=$('#meta'),
      inputEl=$('#input'), sendBtn=$('#send'), newBtn=$('#newbtn'), modelSel=$('#model');
function el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function nearBottom(){ return scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 120; }
function toBottom(force){ if(force||nearBottom()) scrollEl.scrollTop = scrollEl.scrollHeight; }

// ---------- conversation state ----------
let cur=null;          // current assistant turn: {root, parts, tools, live, liveBuf, footer, working}
let generating=false;

function addUser(text){
  const m=el('div','msg user');
  m.appendChild(el('div','who','<span class="av u"></span> 나'));
  m.appendChild(el('div','bubble')).textContent=text;
  logEl.appendChild(m); toBottom(true);
}

function startAssistant(){
  const m=el('div','msg assistant');
  m.appendChild(el('div','who','<span class="av a"></span> Claude'));
  const bubble=el('div','bubble'); m.appendChild(bubble);
  const working=el('div','working','<span class="spin"></span> 생각하는 중…'); bubble.appendChild(working);
  logEl.appendChild(m); toBottom(true);
  cur={ root:m, bubble, parts:bubble, tools:new Map(), live:null, liveBuf:'', working, footer:null, lastText:'' };
}

function ensureLive(){
  if(!cur) return null;
  if(!cur.live){ cur.live=el('div','md live'); cur.bubble.insertBefore(cur.live, cur.working); }
  return cur.live;
}
let rafPending=false;
function flushLive(){
  rafPending=false;
  if(cur && cur.live){ cur.live.innerHTML = renderMd(cur.liveBuf) + '<span class="cursor"></span>'; toBottom(); }
}
function liveAppend(t){
  if(!cur) return; cur.liveBuf += t; ensureLive();
  if(!rafPending){ rafPending=true; requestAnimationFrame(flushLive); }
}
function clearLive(){ if(cur&&cur.live){ cur.live.remove(); cur.live=null; cur.liveBuf=''; } }

function renderTextBlock(text){
  if(!cur) return;
  clearLive();                                   // the authoritative block replaces the live preview
  const d=el('div','md'); d.innerHTML=renderMd(text); cur.bubble.insertBefore(d, cur.working);
  cur.lastText=text; toBottom();
}
function renderThinking(text){
  if(!cur||!text) return;
  const det=el('details','think'); det.appendChild(el('summary',null,'💭 추론'));
  det.appendChild(el('div','body')).textContent=text;
  cur.bubble.insertBefore(det, cur.working);
}
function shortArgs(input){
  if(!input||typeof input!=='object') return '';
  const keys=Object.keys(input); if(!keys.length) return '';
  const k=keys[0]; let v=input[k]; if(typeof v!=='string') v=JSON.stringify(v);
  return k+': '+String(v).slice(0,80);
}
function toolCard(id,name,input){
  if(!cur) return;
  let det=cur.tools.get(id);
  if(!det){
    det=el('details','tool'); det.open=false;
    const sum=el('summary',null,'🔧 <span class="tname"></span> <span class="targ"></span>');
    det.appendChild(sum);
    det.appendChild(el('div','body'));
    cur.bubble.insertBefore(det, cur.working); cur.tools.set(id,det);
  }
  det.querySelector('.tname').textContent=name||'tool';
  det.querySelector('.targ').textContent=shortArgs(input);
  det.querySelector('.body').textContent = (input!=null)? JSON.stringify(input,null,2) : '';
  toBottom();
}
function toolResult(id,content,isErr){
  const det=cur && cur.tools.get(id);
  let txt=content;
  if(Array.isArray(content)) txt=content.map(c=>typeof c==='string'?c:(c.text||JSON.stringify(c))).join('\n');
  if(typeof txt!=='string') txt=JSON.stringify(txt,null,2);
  if(det){
    const r=el('div','res'+(isErr?' err':'')); r.textContent=txt.slice(0,4000);
    det.querySelector('.body').appendChild(r);
  }
}
function finishTurn(result){
  if(!cur) return;
  clearLive();
  if(cur.working) cur.working.remove();
  if(result){
    const cost=result.total_cost_usd!=null?('$'+result.total_cost_usd.toFixed(4)):'';
    const u=result.usage||{}, dur=result.duration_ms!=null?(result.duration_ms/1000).toFixed(1)+'s':'';
    const tok=(u.output_tokens!=null)?(u.input_tokens||0)+'→'+u.output_tokens+' tok':'';
    const f=el('div','footer',[dur,tok,cost].filter(Boolean).join('  ·  '));
    cur.bubble.appendChild(f);
    if(result.subtype && result.subtype!=='success'){
      cur.bubble.appendChild(el('div','err','⚠ '+result.subtype+(result.is_error?' (error)':'')));
    }
  }
  cur=null; setGenerating(false); toBottom();
}

function setGenerating(on){
  generating=on;
  inputEl.disabled=on; sendBtn.disabled=on;
  sendBtn.innerHTML = on ? '<span class="spin"></span>' : '➤';
  dot.className = on ? 'busy' : 'on';
  if(!on){ inputEl.focus(); }
}

// ---------- stream-json event router ----------
function handle(ev){
  const t=ev.type;
  if(t==='_state'||t==='system'){
    if(ev.model) metaEl.textContent='● '+(ev.model||'');
    if(ev.session_id||ev.sessionId){ /* keep latest */ }
    if(t==='system' && ev.model){ for(const o of modelSel.options){ if(ev.model.includes(o.value)) modelSel.value=o.value; } }
    dot.className = generating?'busy':'on';
    return;
  }
  if(t==='_proc'){
    if(ev.status==='started'){ dot.className=generating?'busy':'on'; }
    else if(ev.status==='exited'){ if(generating) finishTurn(null); dot.className='off'; }
    else if(ev.status==='error'){ if(cur){cur.bubble.appendChild(el('div','err','프로세스 오류: '+ev.error));} dot.className='off'; setGenerating(false); }
    return;
  }
  if(t==='_stderr'||t==='_raw'){ return; }

  if(t==='stream_event'){
    const e=ev.event||{}; const et=e.type;
    if(et==='content_block_delta'){
      const d=e.delta||{};
      if(d.type==='text_delta' && d.text) liveAppend(d.text);
      // thinking_delta / input_json_delta: shown via consolidated assistant event
    }
    return;
  }

  if(t==='assistant'){
    const blocks=(ev.message&&ev.message.content)||[];
    for(const b of blocks){
      if(b.type==='text') renderTextBlock(b.text||'');
      else if(b.type==='thinking') renderThinking(b.thinking||b.text||'');
      else if(b.type==='tool_use') toolCard(b.id,b.name,b.input);
    }
    return;
  }

  if(t==='user'){   // tool_result envelopes
    const blocks=(ev.message&&ev.message.content)||[];
    if(Array.isArray(blocks)) for(const b of blocks){
      if(b.type==='tool_result') toolResult(b.tool_use_id,b.content,b.is_error);
    }
    return;
  }

  if(t==='result'){ finishTurn(ev); return; }
}

// ---------- SSE connection ----------
let es=null;
function connect(){
  if(es) es.close();
  es=new EventSource('/events');
  es.onopen=()=>{ if(!generating) dot.className='on'; };
  es.onerror=()=>{ dot.className='off'; };
  es.onmessage=(m)=>{ let o; try{o=JSON.parse(m.data);}catch{return;} try{handle(o);}catch(e){console.error('handle',e,o);} };
}
connect();

// ---------- sending ----------
async function send(){
  const text=inputEl.value.trim(); if(!text||generating) return;
  inputEl.value=''; autosize();
  addUser(text);
  startAssistant(); setGenerating(true);
  try{
    const r=await fetch('/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    if(!r.ok){ const j=await r.json().catch(()=>({})); if(cur) cur.bubble.appendChild(el('div','err','전송 실패: '+(j.error||r.status))); finishTurn(null); }
  }catch(e){ if(cur) cur.bubble.appendChild(el('div','err','전송 오류: '+e.message)); finishTurn(null); }
}
function autosize(){ inputEl.style.height='auto'; inputEl.style.height=Math.min(inputEl.scrollHeight,240)+'px'; }
inputEl.addEventListener('input',autosize);
inputEl.addEventListener('keydown',(e)=>{ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); send(); } });
sendBtn.addEventListener('click',send);

newBtn.addEventListener('click',async()=>{
  logEl.innerHTML=''; cur=null; setGenerating(false);
  await fetch('/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:modelSel.value})});
  inputEl.focus();
});
modelSel.addEventListener('change',async()=>{
  await fetch('/model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:modelSel.value})});
  metaEl.textContent='● '+modelSel.value;
});
metaEl.textContent='● '+modelSel.value;
</script>
</body>
</html>
