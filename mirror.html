<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🪞 Claude 세션 미러</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="preconnect" href="https://rsms.me">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/texmath.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<style>
:root{--bg:#1f1e1c;--bg2:#26241f;--panel:#2a2824;--bd:#3a372f;--bd2:#48443b;--tx:#ece9e1;--tx2:#b8b2a4;--tx3:#8a8576;
--accent:#d97757;--accent2:#c45c3c;--user:#2f3a44;--userbd:#3c4b58;--green:#7bb37b;--red:#d77;
--mono:"SFMono-Regular",ui-monospace,Menlo,monospace;--sans:"Inter","Pretendard",-apple-system,system-ui,sans-serif;
--btww:min(460px,42vw);}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.62;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;transition:padding-right .22s ease}
body.btw-open{padding-right:var(--btww)}  /* push-split: shrink main content left so nothing is covered */
#bar{height:46px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--bd)}
#bar .title{font-weight:600;display:flex;align-items:center;gap:8px}
#bar .spacer{flex:1}
#dot{width:9px;height:9px;border-radius:50%;background:var(--tx3)}#dot.on{background:var(--green)}#dot.off{background:var(--red)}
#sid{font-size:12px;color:var(--tx3);font-family:var(--mono)}
#live{font-size:11px;color:var(--green);border:1px solid var(--bd2);border-radius:20px;padding:2px 9px}
#scroll{flex:1 1 auto;min-height:0;overflow-y:auto}
#log{max-width:840px;margin:0 auto;padding:24px 20px 60px}
.msg{margin:0 0 22px}
.msg .who{font-size:12px;color:var(--tx3);font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.av{width:18px;height:18px;border-radius:5px;display:inline-block;vertical-align:-3px}.av.a{background:linear-gradient(135deg,var(--accent),var(--accent2))}.av.u{background:#46586a}
.msg.user .bubble{background:var(--user);border:1px solid var(--userbd);border-radius:12px;padding:11px 15px;white-space:pre-wrap}
.md{word-wrap:break-word}
.md p{margin:.5em 0}.md h1,.md h2,.md h3,.md h4{margin:1.1em 0 .5em;line-height:1.3;font-weight:650}
.md h1{font-size:1.5em;border-bottom:1px solid var(--bd);padding-bottom:.2em}.md h2{font-size:1.3em}.md h3{font-size:1.13em}
.md a{color:var(--accent);text-decoration:none}.md a:hover{text-decoration:underline}
.md code{font-family:var(--mono);font-size:.9em;background:#00000040;border:1px solid var(--bd);border-radius:5px;padding:1px 5px}
.md pre{background:#171614;border:1px solid var(--bd);border-radius:10px;padding:12px 14px;overflow:auto;margin:.7em 0}
.md pre code{background:none;border:none;padding:0;font-size:.86em}
.md blockquote{border-left:3px solid var(--bd2);margin:.6em 0;padding:.1em 1em;color:var(--tx2)}
.md ul,.md ol{padding-left:1.5em;margin:.4em 0}.md li{margin:.18em 0}
.md table{border-collapse:collapse;margin:.7em 0;display:block;overflow:auto}.md th,.md td{border:1px solid var(--bd2);padding:6px 11px}.md th{background:var(--panel)}
.md hr{border:none;border-top:1px solid var(--bd);margin:1.2em 0}
.md .katex{font-size:1.06em}.md .katex-display{margin:.7em 0;overflow:auto hidden}
.md img{max-width:100%;border-radius:8px}
.tool{margin:8px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg2);overflow:hidden}
.tool>summary{cursor:pointer;list-style:none;padding:8px 12px;font-family:var(--mono);font-size:12.5px;color:var(--tx2);display:flex;gap:8px}
.tool>summary::-webkit-details-marker{display:none}.tool>summary .tn{color:var(--accent);font-weight:600}.tool>summary .ta{color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .body{border-top:1px solid var(--bd);padding:10px 12px;font-family:var(--mono);font-size:12px;color:var(--tx2);white-space:pre-wrap;max-height:300px;overflow:auto}
.think{margin:6px 0;border:1px dashed var(--bd2);border-radius:10px;background:#00000022}
.think>summary{cursor:pointer;list-style:none;padding:7px 12px;font-size:12.5px;color:var(--tx3)}.think>summary::-webkit-details-marker{display:none}
.think .body{padding:0 12px 10px;color:var(--tx3);font-style:italic;white-space:pre-wrap}
#foot{flex:0 0 auto;background:var(--bg2);border-top:1px solid var(--bd);padding:10px 16px}
#cwrap{max-width:840px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:#2a2824;border:1px solid var(--bd2);border-radius:14px;padding:7px 7px 7px 14px}
#cwrap:focus-within{border-color:var(--accent)}
#input{flex:1;background:none;border:none;color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.5;resize:none;max-height:160px;outline:none;padding:5px 0}
#send{flex:0 0 auto;width:36px;height:36px;padding:0;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center}
#send:hover{background:var(--accent2)}#send:disabled{opacity:.45;cursor:default}
#status{max-width:840px;margin:7px auto 0;font-family:var(--mono);font-size:11.5px;color:var(--tx3);text-align:center;line-height:1.9}
#status .m{color:var(--accent);font-weight:600}
#status b{color:var(--tx2);font-weight:600}
#status .sep{opacity:.4}
#status .bar{display:inline-block;width:80px;height:7px;background:#00000055;border:1px solid var(--bd2);border-radius:4px;overflow:hidden;vertical-align:-1px;margin:0 2px}
#status .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* "Claude 작업 중" progress indicator — sits above the composer, hidden by default */
#working{display:none;max-width:840px;margin:0 auto 7px;font-size:12.5px;color:var(--accent);justify-content:center;align-items:center;gap:8px}
#working.on{display:flex}
#working .spin{display:inline-block;animation:wspin 1.1s linear infinite}
#workingLabel{font-family:var(--mono);color:var(--tx2)}
@keyframes wspin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:6px;border:2px solid transparent;background-clip:content-box}
/* btw side drawer */
#btwBtn{font-size:12px;color:var(--tx2);background:var(--panel);border:1px solid var(--bd2);border-radius:8px;padding:4px 10px;cursor:pointer}
#btwBtn:hover{background:var(--panel2,#302d28);color:var(--tx)}
/* btw push-split drawer: fixed right panel; body padding-right (= --btww) shrinks the main
   content left so the drawer fills the gap and NOTHING is covered (overlay→push fix) */
#btw{position:fixed;top:0;right:0;bottom:0;width:var(--btww);display:flex;flex-direction:column;background:var(--bg2);border-left:1px solid var(--bd);transform:translateX(100%);transition:transform .22s ease;z-index:50}
#btw.open{transform:none}
#btwhead{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 12px;height:46px;background:var(--bg);border-bottom:1px solid var(--bd)}
#btwhead .t{font-weight:600;font-size:13px}
#btwhead .spacer{flex:1}
#btwmode{font-size:11px;color:var(--tx3);border:1px solid var(--bd2);border-radius:20px;padding:2px 8px}
#btwhead button{font-size:12px;color:var(--tx2);background:var(--panel);border:1px solid var(--bd2);border-radius:8px;padding:3px 8px;cursor:pointer}
#btwhead button:hover{color:var(--tx)}
#btwfork.on{color:var(--accent);border-color:var(--accent)}
#btwlog{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px 14px 24px}
#btwlog .notice{font-size:11.5px;color:var(--tx3);font-family:var(--mono);margin:6px 0;padding:4px 8px;border-left:2px solid var(--bd2)}
#btwlog .notice.warn{color:var(--yellow,#d8b86a)}#btwlog .notice.err{color:var(--red)}
#btwfoot{flex:0 0 auto;background:var(--bg);border-top:1px solid var(--bd);padding:10px 12px}
#btwcwrap{display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--bd2);border-radius:12px;padding:6px 6px 6px 12px}
#btwcwrap:focus-within{border-color:var(--accent)}
#btwInput{flex:1;background:none;border:none;color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.5;resize:none;max-height:140px;outline:none;padding:4px 0}
#btwSend{flex:0 0 auto;width:32px;height:32px;padding:0;border-radius:9px;border:none;background:var(--accent);color:#fff;font-size:15px;cursor:pointer;display:grid;place-items:center}
#btwSend:hover{background:var(--accent2)}#btwSend:disabled{opacity:.45;cursor:default}
/* AskUserQuestion interactive picker */
.askq{margin:10px 0 22px;border:1px solid var(--accent2);border-radius:12px;background:#2a241f;overflow:hidden}
.askq.done{border-color:var(--bd2);opacity:.9}
.askq .ah{padding:8px 14px;background:#3a2a22;font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.3px}
.askq.done .ah{background:var(--panel);color:var(--tx3)}
.askq .q{padding:12px 14px;border-top:1px solid var(--bd)}
.askq .qh{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);margin-bottom:3px}
.askq .qt{font-weight:600;margin-bottom:10px}
.askq .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border:1px solid var(--bd2);border-radius:9px;background:var(--bg2);color:var(--tx);font-family:var(--sans);font-size:14px;cursor:pointer;line-height:1.45}
.askq .opt:hover:not(:disabled){border-color:var(--accent);background:#322a24}
.askq .opt:disabled{cursor:default;opacity:.6}
.askq .opt .ol{font-weight:600}
.askq .opt .od{color:var(--tx2);font-size:12.5px;margin-top:2px}
.askq .other{margin-top:9px;display:flex;gap:7px}
.askq .other input{flex:1;background:var(--bg);border:1px solid var(--bd2);border-radius:8px;color:var(--tx);padding:8px 10px;font-family:var(--sans);font-size:14px;outline:none}
.askq .other input:focus{border-color:var(--accent)}
.askq .other button{flex:0 0 auto;border:none;border-radius:8px;background:var(--accent);color:#fff;padding:0 14px;cursor:pointer}
.askq .other button:disabled{opacity:.5;cursor:default}
.askq .note{padding:0 14px 12px;color:var(--tx3);font-size:12px}
.askq .ast{padding:8px 14px;border-top:1px solid var(--bd);font-family:var(--mono);font-size:12px;color:var(--tx2)}
.askq.done .ast{color:var(--green)}
#guard{max-width:840px;margin:0 auto 7px;display:none;font-size:12.5px;color:var(--accent);text-align:center;line-height:1.5}
#foot.locked #guard{display:block}
#foot.locked #input::placeholder{color:var(--accent)}
</style>
</head>
<body>
<div id="bar">
  <span class="title">🪞 세션 미러</span>
  <span id="dot"></span><span id="live">LIVE</span>
  <span class="spacer"></span>
  <button id="btwBtn" title="side question (메인 세션 맥락 인지, 격리)">💬 btw</button>
  <span id="sid"></span>
</div>
<div id="scroll"><div id="log"></div></div>

<!-- btw side conversation drawer -->
<div id="btw">
  <div id="btwhead">
    <span class="t">💬 btw — side question</span>
    <span class="spacer"></span>
    <span id="btwmode">summary</span>
    <button id="btwfork" title="전체 맥락(fork) ↔ 요약(summary) 전환">🔱 전체맥락</button>
    <button id="btwclose" title="닫기">✕</button>
  </div>
  <div id="btwlog"></div>
  <div id="btwfoot">
    <div id="btwcwrap">
      <textarea id="btwInput" rows="1" placeholder="옆질문 입력 → 메인 세션엔 기록 안 됨  (Enter 전송)"></textarea>
      <button id="btwSend" title="전송">➤</button>
    </div>
  </div>
</div>
<div id="foot">
  <div id="working"><span class="spin">✻</span><span id="workingLabel">Claude 작업 중</span></div>
  <div id="guard">⌛ 위 질문에 답하는 중 — 보기를 클릭하거나, 입력창에 쓰고 Enter 치면 "직접 입력(기타)"으로 전송됩니다</div>
  <div id="cwrap">
    <textarea id="input" rows="1" placeholder="메시지 → 터미널 주입  ·  `btw 질문` → 곁질문(오른쪽 패널)  (Enter 전송)"></textarea>
    <button id="send" title="터미널 세션에 주입">➤</button>
  </div>
  <div id="status">—</div>
</div>

<script>
const md=window.markdownit({html:true,linkify:true,breaks:false,typographer:true,
  highlight:(s,l)=>{try{if(l&&hljs.getLanguage(l))return hljs.highlight(s,{language:l}).value;}catch(e){}return '';}});
if(window.texmath) md.use(window.texmath,{engine:window.katex,delimiters:'dollars',katexOptions:{throwOnError:false,strict:false}});
// Normalize LaTeX bracket delimiters \(..\)->$..$ and \[..\]->$$..$$ so both styles render
// (texmath only knows 'dollars'). Code fences / inline code are masked first so literal
// backslash-paren inside code is left untouched. Inner whitespace is trimmed to satisfy
// texmath's dollars inline rule (no space adjacent to the $).
function normMath(src){
  if(!src) return src;
  const stash=[];
  src=src.replace(/```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]+`/g,m=>{stash.push(m);return '\x02CODEMASK'+(stash.length-1)+'\x03';});
  src=src.replace(/\\\[([\s\S]+?)\\\]/g,(_,x)=>'$$'+x.trim()+'$$');
  src=src.replace(/\\\(([\s\S]+?)\\\)/g,(_,x)=>'$'+x.trim()+'$');
  src=src.replace(/\x02CODEMASK(\d+)\x03/g,(_,i)=>stash[+i]);
  return src;
}
const renderMd=t=>md.render(normMath(t||''));
const $=s=>document.querySelector(s), logEl=$('#log'), scrollEl=$('#scroll'), dot=$('#dot'), sidEl=$('#sid');
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
// ---- "Claude 작업 중" indicator: live elapsed-seconds timer so silent thinking gaps still look alive ----
const workEl=$('#working'), workLabelEl=$('#workingLabel');
let workStart=0, workIv=null;
function workTick(){ const s=Math.floor((Date.now()-workStart)/1000); workLabelEl.textContent='Claude 작업 중 · '+s+'s'; }
function workShow(){ if(workStart) return; workStart=Date.now(); workEl.classList.add('on'); workTick(); workIv=setInterval(workTick,250); }
function workHide(){ if(!workStart) return; workStart=0; if(workIv){clearInterval(workIv);workIv=null;} workEl.classList.remove('on'); }
// Scroll model: a NEW user turn pins to the TOP of the view; the answer flows below it so
// you read top→down. Assistant output never yanks the view to the bottom. A bottom spacer
// gives just enough slack that a short turn can still reach the top.
const spacer=el('div');
let lastUserEl=null, booting=true, bootT=null;
function ensureSpacer(){ if(spacer.parentNode!==logEl) logEl.appendChild(spacer); }
function addMsg(m){ ensureSpacer(); logEl.insertBefore(m, spacer); }
function recalcSpacer(){
  spacer.style.height='0px';
  if(!lastUserEl) return;
  const y=lastUserEl.getBoundingClientRect().top - logEl.getBoundingClientRect().top;
  spacer.style.height=Math.max(0, scrollEl.clientHeight - (logEl.scrollHeight - y))+'px';
}
function pinUserTop(elm){
  if(!elm) return;
  lastUserEl=elm; recalcSpacer();
  const delta=elm.getBoundingClientRect().top - scrollEl.getBoundingClientRect().top;
  scrollEl.scrollTop += delta - 12;
}
function settleBoot(){ if(!booting) return; clearTimeout(bootT); bootT=setTimeout(()=>{ booting=false; pinUserTop(lastUserEl); }, 350); }

let lastRole=null, curAsst=null;
function userMsg(text){
  lastRole='user'; curAsst=null;
  const m=el('div','msg user'); m.appendChild(el('div','who','<span class="av u"></span> 나'));
  m.appendChild(el('div','bubble')).textContent=text; addMsg(m); lastUserEl=m; if(!booting) pinUserTop(m);
}
function asstContainer(){
  if(lastRole==='assistant'&&curAsst) return curAsst;
  lastRole='assistant';
  const m=el('div','msg assistant'); m.appendChild(el('div','who','<span class="av a"></span> Claude'));
  const b=el('div','bubble'); m.appendChild(b); addMsg(m); curAsst=b; return b;
}
function asstText(text){ const b=asstContainer(); const d=el('div','md'); d.innerHTML=renderMd(text); b.appendChild(d); recalcSpacer(); }
function asstThink(text){ if(!text)return; const b=asstContainer(); const det=el('details','think'); det.appendChild(el('summary',null,'💭 추론')); det.appendChild(el('div','body')).textContent=text; b.appendChild(det); recalcSpacer(); }
function asstTool(name,input){
  const b=asstContainer(); const det=el('details','tool'); const sum=el('summary',null,'🔧 <span class="tn"></span> <span class="ta"></span>'); det.appendChild(sum);
  let arg=''; if(input&&typeof input==='object'){const k=Object.keys(input)[0]; if(k){let v=input[k]; if(typeof v!=='string')v=JSON.stringify(v); arg=k+': '+String(v).slice(0,80);}}
  sum.querySelector('.tn').textContent=name||'tool'; sum.querySelector('.ta').textContent=arg;
  det.appendChild(el('div','body')).textContent=input!=null?JSON.stringify(input,null,2):''; b.appendChild(det); recalcSpacer();
}
// ---- AskUserQuestion interactive picker (server: {type:'askq'} render, {type:'askq_done'} resolve) ----
// Selecting provided option index i = `down`×i then `enter` (highlight starts at row 0); the "기타"
// (custom text) row sits just below the provided options at index = options.length.
const askqEls={}; let activePicker=null;
function setAst(a,txt){ const e=a&&a.el&&a.el.querySelector('.ast'); if(e)e.textContent=txt; }
function updateGuard(){ const f=$('#foot'); if(f) f.classList.toggle('locked',!!activePicker); }
function resetAskq(){ for(const k in askqEls) delete askqEls[k]; activePicker=null; updateGuard(); }
function selectSteps(i){ return i>0 ? [{key:'down',n:i},{key:'enter'}] : [{key:'enter'}]; }
function renderAskq(o){
  if(askqEls[o.id]) return;                       // idempotent across backfill replays
  lastRole=null; curAsst=null;                    // stand alone, don't merge into an assistant bubble
  const qs=Array.isArray(o.questions)?o.questions:[];
  const single = qs.length===1 && !qs[0].multiSelect;
  const card=el('div','askq'); card.appendChild(el('div','ah','❓ 질문'));
  qs.forEach((q)=>{
    const qd=el('div','q');
    if(q.header) qd.appendChild(el('div','qh')).textContent=q.header;
    qd.appendChild(el('div','qt')).textContent=(q.question||'')+(q.multiSelect?'   · 다중 선택':'');
    const opts=Array.isArray(q.options)?q.options:[];
    opts.forEach((op,oi)=>{
      const btn=el('button','opt');
      btn.appendChild(el('span','ol')).textContent=(oi+1)+'. '+(op.label||'');
      if(op.description) btn.appendChild(el('div','od')).textContent=op.description;
      if(single) btn.onclick=()=>answer(o.id, selectSteps(oi)); else btn.disabled=true;
      qd.appendChild(btn);
    });
    if(single){                                   // "기타" → select the auto-appended "Type something." row
      const wrap=el('div','other'), inp=el('input'), b=el('button',null,'전송');
      inp.type='text'; inp.placeholder='직접 입력 (기타)…';
      const go=()=>{ const t=inp.value.trim(); if(!t)return; answer(o.id,[{key:'down',n:opts.length},{key:'enter'},{text:t},{key:'enter'}]); };
      b.onclick=go; inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.isComposing){ e.preventDefault(); go(); } });
      wrap.appendChild(inp); wrap.appendChild(b); qd.appendChild(wrap);
    }
    card.appendChild(qd);
  });
  if(!single) card.appendChild(el('div','note','여러 질문/다중 선택은 터미널에서 직접 선택하세요 (보기는 위에 표시).'));
  card.appendChild(el('div','ast','● 응답 대기 중'));
  addMsg(card);
  askqEls[o.id]={el:card, resolved:false, single, otherRow: single?(qs[0].options||[]).length:0};
  activePicker=o.id; updateGuard(); recalcSpacer();
}
async function answer(id, steps){
  const a=askqEls[id]; if(!a||a.resolved) return;
  a.el.querySelectorAll('button,input').forEach(x=>x.disabled=true);
  setAst(a,'⏳ 선택 전송 중…');
  try{
    const r=await fetch('/mirror/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({steps,surface:surfaceParam})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok) setAst(a,'⏳ 전송됨 — 확인 대기…');
    else { setAst(a,'⚠ 실패: '+(j.error||('HTTP '+r.status))); a.el.querySelectorAll('button,input').forEach(x=>x.disabled=false); }
  }catch(e){ setAst(a,'⚠ 오류: '+e.message); a.el.querySelectorAll('button,input').forEach(x=>x.disabled=false); }
}
function answerLabel(content){
  if(!content) return '답변 완료';
  const m=[...String(content).matchAll(/=\s*"([^"]+)"/g)].map(x=>x[1]);
  return m.length ? m.join(' · ') : '답변 완료';
}
function resolveAskq(o){
  const a=askqEls[o.id]; if(!a) return;
  a.resolved=true; a.el.classList.add('done');
  a.el.querySelectorAll('button,input').forEach(x=>x.disabled=true);
  setAst(a,'✓ '+answerLabel(o.content));
  if(activePicker===o.id){ activePicker=null; updateGuard(); }
  recalcSpacer();
}
function fmtTok(n){ n=n||0; if(n>=1e6) return (n/1e6).toFixed(n>=1e7?0:1)+'M'; if(n>=1000) return (n/1000).toFixed(n>=1e4?0:1)+'k'; return ''+n; }
function prettyModel(m){ if(!m)return '—'; if(/opus-4-8/.test(m))return 'Opus 4.8'; if(/sonnet-4-6/.test(m))return 'Sonnet 4.6'; if(/haiku-4-5/.test(m))return 'Haiku 4.5'; return m.replace(/^claude-/,''); }
function onStatus(o){
  const pct=(o.ctxPct!=null)?o.ctxPct:0;
  const parts=['<span class="m">◆ '+(o.model||'—')+'</span>'];
  if(o.effort) parts.push('<b>'+o.effort+'</b>');                       // effort value only (no label)
  parts.push('<span class="bar"><i style="width:'+pct+'%"></i></span> '+pct+'%');   // context meter (no "ctx" label)
  if(o.r5!=null) parts.push('5h <b>'+o.r5+'%</b>');                     // remaining in 5-hour window
  if(o.r7!=null) parts.push('7d <b>'+o.r7+'%</b>');                     // remaining in 7-day window
  document.getElementById('status').innerHTML=parts.join('<span class="sep"> · </span>');
}
// AUTHORITATIVE "working" signal from the terminal spinner (read-screen), replacing the jsonl heuristic.
function onWorking(o){
  if(o.active){
    if(workIv){ clearInterval(workIv); workIv=null; }              // server now drives the label; stop the local ticker
    workStart = workStart || Date.now();
    workEl.classList.add('on');
    const parts=['Claude 작업 중']; if(o.elapsed) parts.push(o.elapsed); if(o.tokens) parts.push('↑'+o.tokens);
    workLabelEl.textContent = parts.join(' · ');
  } else { workHide(); }
}
function handle(o){
  if(o.type==='_status'){ onStatus(o); return; }
  if(o.type==='_working'){ onWorking(o); return; }
  if(o.type==='_info'){ if(o.session) mainSession=o.session; sidEl.textContent=o.session?('session '+o.session.slice(0,8)+'…'):''; logEl.innerHTML=''; lastRole=null; curAsst=null; lastUserEl=null; booting=true; resetAskq(); ensureSpacer(); return; }
  if(o.type==='_err'){ sidEl.textContent='⚠ '+o.error; return; }
  if(o.type==='askq'){ renderAskq(o); settleBoot(); return; }
  if(o.type==='askq_done'){ resolveAskq(o); return; }
  if(o.type!=='msg') return;
  if(o.role==='user') userMsg(o.text);
  else if(o.role==='assistant'){ if(o.kind==='text')asstText(o.text); else if(o.kind==='thinking')asstThink(o.text); else if(o.kind==='tool')asstTool(o.name,o.input); }
  settleBoot();
}
const params=new URLSearchParams(location.search);
const qs=params.get('session')?('?session='+encodeURIComponent(params.get('session'))):'';
const surfaceParam=params.get('surface')||'';   // remote-input target for THIS mirror (decoupled from global)
let mainSession=params.get('session')||'';       // main terminal session id (updated from _info); seed for btw
// ---- btw popup window: opens btw.html in a small separate window so the mirror stays full-width ----
let btwWin=null, btwMode='summary';               // btwMode = mode requested for the next popup open
function btwPopupURL(q){ const p=new URLSearchParams(); if(mainSession)p.set('session',mainSession); p.set('mode',btwMode); if(q)p.set('q',q); return '/btw-window?'+p.toString(); }
function btwOpenPopup(q){
  if(btwWin && !btwWin.closed){ btwWin.focus(); if(q) btwWin.postMessage({btwq:q}, location.origin); }
  else { btwWin = window.open(btwPopupURL(q), 'btwwin', 'width=460,height=680,menubar=no,toolbar=no,location=no,status=no'); }
}
let es;
function connect(){
  if(es)es.close();
  es=new EventSource('/mirror/stream'+qs+(surfaceParam?((qs?'&':'?')+'surface='+encodeURIComponent(surfaceParam)):''));
  es.onopen=()=>dot.className='on';
  es.onerror=()=>dot.className='off';
  es.onmessage=m=>{let o;try{o=JSON.parse(m.data);}catch{return;}try{handle(o);}catch(e){console.error(e);}};
}
connect();
// after KaTeX web-fonts settle, re-pin the last user turn to the top (corrects font reflow)
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(lastUserEl) pinUserTop(lastUserEl); });

// ---- remote input: type here → injected into the terminal Claude session via the server ----
const inputEl=$('#input'), sendBtn=$('#send');
function autosize(){ inputEl.style.height='auto'; inputEl.style.height=Math.min(inputEl.scrollHeight,160)+'px'; }
inputEl.addEventListener('input',autosize);
async function sendToTerminal(){
  const text=inputEl.value.trim();
  if(activePicker){                                  // a question is pending: NEVER inject a bare line
    const a=askqEls[activePicker];                   // (its trailing Enter would confirm option 1)
    if(a&&a.single&&text){ inputEl.value=''; autosize(); answer(activePicker,[{key:'down',n:a.otherRow},{key:'enter'},{text},{key:'enter'}]); }
    inputEl.focus(); return;
  }
  if(!text) return;
  // `btw …` / `/btw …` prefix (mirrors the CLI /btw): route to the SIDE drawer, NOT the terminal.
  // ^ anchor ensures a mid-sentence "btw" is never hijacked. IME-safe: only fires on committed Enter.
  const bm=text.match(/^\/?btw\b\s*([\s\S]*)$/i);
  if(bm){
    const q=bm[1].trim();
    inputEl.value=''; autosize();
    await btwOpenDrawer();                            // open the push-split drawer + ensure session
    if(q){ btwInput.value=q; btwAutosize(); btwSend(); }   // non-empty → send as a side question
    else btwInput.focus();                           // bare `btw` → just open + focus
    return;
  }
  sendBtn.disabled=true;
  try{
    const r=await fetch('/mirror/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,surface:surfaceParam})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok){ inputEl.value=''; autosize(); workShow(); }   // instant feedback before the jsonl round-trips
    else { alert('주입 실패: '+(j.error||('HTTP '+r.status))); }
  }catch(e){ alert('전송 오류: '+e.message); }
  finally{ sendBtn.disabled=false; inputEl.focus(); }
}
sendBtn.addEventListener('click',sendToTerminal);
// IME (한글 조합) guard: never submit while a composition is in progress, or we'd send half-composed jamo
let composing=false;
inputEl.addEventListener('compositionstart',()=>{ composing=true; });
inputEl.addEventListener('compositionend',()=>{ composing=false; });
inputEl.addEventListener('keydown',(e)=>{ if(e.key==='Enter'&&!e.shiftKey&&!composing&&!e.isComposing){ e.preventDefault(); sendToTerminal(); } });

// ---- btw side conversation: isolated, context-aware drawer (own SSE + own claude proc server-side) ----
const btwEl=$('#btw'), btwLog=$('#btwlog'), btwInput=$('#btwInput'), btwSendBtn=$('#btwSend'),
      btwModeEl=$('#btwmode'), btwForkBtn=$('#btwfork');
let btwId=null, btwES=null, btwAsst=null, btwRole=null;   // btwMode declared above (shared w/ popup)
// drawer-local renderers (mirror the main ones but append to #btwlog; reuse renderMd+el)
function btwUser(text){
  btwRole='user'; btwAsst=null;
  const m=el('div','msg user'); m.appendChild(el('div','who','<span class="av u"></span> 나'));
  m.appendChild(el('div','bubble')).textContent=text; btwLog.appendChild(m); btwLog.scrollTop=btwLog.scrollHeight;
}
function btwAsstContainer(){
  if(btwRole==='assistant'&&btwAsst) return btwAsst;
  btwRole='assistant';
  const m=el('div','msg assistant'); m.appendChild(el('div','who','<span class="av a"></span> Claude'));
  const b=el('div','bubble'); m.appendChild(b); btwLog.appendChild(m); btwAsst=b; return b;
}
function btwAsstText(text){ const b=btwAsstContainer(); const d=el('div','md'); d.innerHTML=renderMd(text); b.appendChild(d); btwLog.scrollTop=btwLog.scrollHeight; }
function btwAsstTool(name,input){
  const b=btwAsstContainer(); const det=el('details','tool'); const sum=el('summary',null,'🔧 <span class="tn"></span> <span class="ta"></span>'); det.appendChild(sum);
  let arg=''; if(input&&typeof input==='object'){const k=Object.keys(input)[0]; if(k){let v=input[k]; if(typeof v!=='string')v=JSON.stringify(v); arg=k+': '+String(v).slice(0,80);}}
  sum.querySelector('.tn').textContent=name||'tool'; sum.querySelector('.ta').textContent=arg;
  det.appendChild(el('div','body')).textContent=input!=null?JSON.stringify(input,null,2):''; b.appendChild(det); btwLog.scrollTop=btwLog.scrollHeight;
}
function btwNotice(text,cls){ const d=el('div','notice'+(cls?' '+cls:'')); d.textContent=text; btwLog.appendChild(d); btwLog.scrollTop=btwLog.scrollHeight; }
function btwHandle(o){
  if(o.type==='msg'){
    if(o.role==='user') btwUser(o.text);
    else if(o.role==='assistant'){ if(o.kind==='tool') btwAsstTool(o.name,o.input); else btwAsstText(o.text); }
    return;
  }
  if(o.type==='_warn'){ btwNotice('⚠ '+o.text,'warn'); return; }
  if(o.type==='_stderr'){ btwNotice(o.text.trim(),'err'); return; }
  if(o.type==='_err'){ btwNotice('⚠ '+o.error,'err'); return; }
  if(o.type==='_raw'){ return; }
  // _proc: tiny status only when it errors; ignore normal exit
  if(o.type==='_proc'&&o.status==='error'){ btwNotice('프로세스 오류: '+(o.error||''),'err'); return; }
}
async function btwOpenSession(){
  // POST /btw/new then subscribe to its SSE; resets drawer-local render state
  btwRole=null; btwAsst=null;
  try{
    const r=await fetch('/btw/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mainSession,mode:btwMode})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok){ btwNotice('세션 생성 실패: '+(j.error||('HTTP '+r.status)),'err'); return; }
    btwId=j.id; btwMode=j.mode||btwMode; btwModeEl.textContent=btwMode; btwForkBtn.classList.toggle('on',btwMode==='fork');
    if(btwES) btwES.close();
    btwES=new EventSource('/btw/events?id='+encodeURIComponent(btwId));
    btwES.onmessage=m=>{ let o; try{o=JSON.parse(m.data);}catch{return;} try{btwHandle(o);}catch(e){console.error(e);} };
  }catch(e){ btwNotice('연결 오류: '+e.message,'err'); }
}
function btwCloseSession(){
  if(btwES){ btwES.close(); btwES=null; }
  if(btwId){ const id=btwId; fetch('/btw/close',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}).catch(()=>{}); }
  btwId=null;
}
// open the push-split drawer (idempotent) + ensure a session exists; reused by button, prefix, shortcut, URL param
async function btwOpenDrawer(){
  const wasOpen=btwEl.classList.contains('open');
  btwEl.classList.add('open'); document.body.classList.add('btw-open');   // both classes → drawer slides + body shrinks
  if(!btwId) await btwOpenSession();
  if(!wasOpen) btwInput.focus();
}
// close the drawer (un-shrink the body) + tear down the session (reuses ✕ semantics)
function btwCloseDrawer(){ btwEl.classList.remove('open'); document.body.classList.remove('btw-open'); btwCloseSession(); }
async function btwToggleDrawer(){ if(btwEl.classList.contains('open')) btwCloseDrawer(); else await btwOpenDrawer(); }
$('#btwBtn').addEventListener('click',btwToggleDrawer);
$('#btwclose').addEventListener('click',btwCloseDrawer);
btwForkBtn.addEventListener('click',async()=>{
  btwCloseSession();                            // close current side session
  btwMode = btwMode==='summary' ? 'fork' : 'summary';
  btwLog.innerHTML='';                          // clear transcript for the fresh mode
  await btwOpenSession();
  btwInput.focus();
});
async function btwSend(){
  const text=btwInput.value.trim(); if(!text) return;
  if(!btwId){ await btwOpenSession(); if(!btwId) return; }
  btwSendBtn.disabled=true;
  try{
    // server echoes the user msg back over SSE, so do NOT render it locally here
    const r=await fetch('/btw/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:btwId,text})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok){ btwInput.value=''; btwAutosize(); }
    else btwNotice('전송 실패: '+(j.error||('HTTP '+r.status)),'err');
  }catch(e){ btwNotice('전송 오류: '+e.message,'err'); }
  finally{ btwSendBtn.disabled=false; btwInput.focus(); }
}
function btwAutosize(){ btwInput.style.height='auto'; btwInput.style.height=Math.min(btwInput.scrollHeight,140)+'px'; }
btwInput.addEventListener('input',btwAutosize);
btwSendBtn.addEventListener('click',btwSend);
// IME (한글 조합) guard — identical to the main composer
let btwComposing=false;
btwInput.addEventListener('compositionstart',()=>{ btwComposing=true; });
btwInput.addEventListener('compositionend',()=>{ btwComposing=false; });
btwInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter'&&!e.shiftKey&&!btwComposing&&!e.isComposing){ e.preventDefault(); btwSend(); } });
// global shortcuts: Cmd/Ctrl+B toggles the push-split drawer (works even from a textarea); Esc closes it
document.addEventListener('keydown',(e)=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='b'){ e.preventDefault(); btwToggleDrawer(); return; }
  if(e.key==='Escape'&&btwEl.classList.contains('open')){ e.preventDefault(); btwCloseDrawer(); }
});
// URL param: ?btw=1 (or =open) auto-opens the drawer once on load
if(['1','open'].includes((params.get('btw')||'').toLowerCase())) btwOpenDrawer();
</script>
